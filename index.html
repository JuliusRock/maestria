  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;background:#0B0E14;}
    body{font-family:system-ui,sans-serif;color:#E2E6F0;overflow-x:hidden;}
    #loading{position:fixed;inset:0;background:#0B0E14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;}
    .sp{width:48px;height:48px;border-radius:50%;border:3px solid #252B3D;border-top-color:#D9A441;animation:spin 0.8s linear infinite;}
    #loading p{color:#8A92A8;font-size:14px;}
    #err{display:none;position:fixed;inset:0;background:#0B0E14;color:#D94A7A;padding:20px;font-size:12px;font-family:monospace;z-index:9999;overflow:auto;white-space:pre-wrap;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>

</head>

  <div id="loading"><div class="sp"></div><p>A carregar...</p></div>
  <div id="err"></div>
  <div id="root"></div>
  <script>
  window.onerror = function(msg, src, line, col, err) {
    var d = document.getElementById('err');
    var l = document.getElementById('loading');
    if(d){ d.style.display='block'; d.textContent='ERRO linha '+line+':\n'+msg+'\n\n'+(err?err.stack:''); }
    if(l) l.style.display='none';
    return false;
  };
  var useState = React.useState;
  var useEffect = React.useEffect;
  </script>

function mkIcon(paths) {
  return function(props) {
    var size = props.size || 24;
    var color = props.color || 'currentColor';
    var sw = props.strokeWidth || 2;
    var style = props.style || {};
    return React.createElement('svg', {
      xmlns: 'http://www.w3.org/2000/svg',
      width: size, height: size,
      viewBox: '0 0 24 24',
      fill: 'none',
      stroke: color,
      strokeWidth: sw,
      strokeLinecap: 'round',
      strokeLinejoin: 'round',
      style: style
    }, paths.map(function(p, i) {
      return React.createElement(p[0], Object.assign({key: i}, p[1]));
